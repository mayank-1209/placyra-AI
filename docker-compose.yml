version: '3.8'

services:
  # ==============================================================================
  # MySQL 8.0 Relational Database
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: placyra_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-placyra_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-placyra_db}
      MYSQL_USER: ${MYSQL_USER:-placyra_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-placyra_secret_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-placyra_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - placyra_network

  # ==============================================================================
  # Qdrant Vector Database
  # ==============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: placyra_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - placyra_network

  # ==============================================================================
  # Ollama Local AI & Embedding Server
  # ==============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: placyra_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - placyra_network

  # ==============================================================================
  # FastAPI Backend API & RAG Pipeline
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placyra_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-placyra_db}
      - MYSQL_USER=${MYSQL_USER:-placyra_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-placyra_secret_pass}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=llama3
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-placyra_super_secret_jwt_key_2026_campus_placement_assistant_token_seed}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - placyra_network

  # ==============================================================================
  # React Frontend (Vite + Tailwind CSS)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placyra_frontend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - placyra_network

  # ==============================================================================
  # Nginx Reverse Proxy
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: placyra_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - placyra_network

networks:
  placyra_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  qdrant_storage:
    driver: local
  ollama_data:
    driver: local
  uploads_data:
    driver: local
