<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/placyra-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Placyra | AI-Powered Campus Placement Assistant</title>
    <meta name="description" content="AI-Powered Campus Placement and Career Preparation Assistant with RAG mock interviews, resume OCR, and skill-gap radar analysis." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Inline anti-flash script for instantaneous Theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('placyra-theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google AdSense Readiness Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0000000000000000" crossorigin="anonymous"></script>
  </head>
  <body class="bg-bg text-text min-h-screen antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
