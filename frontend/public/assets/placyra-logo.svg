<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <!-- Background Gradient for Icon Emblem -->
    <linearGradient id="placyraIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="placyraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Filter for subtle drop glow -->
    <filter id="placyraFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Graduation Cap + Neural Matrix Nodes) -->
  <g transform="translate(6, 6)" filter="url(#placyraFilter)">
    <!-- Base Rounded Shield Hexagon -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#placyraIconGrad)" />

    <!-- Stylized Academic Cap -->
    <path d="M24 12L38 19L24 26L10 19L24 12Z" fill="#FFFFFF" fill-opacity="0.95" />
    
    <!-- Cap Neck / Body -->
    <path d="M15 22V29C15 32.5 19 35.5 24 35.5C29 35.5 33 32.5 33 29V22L24 26.5L15 22Z" fill="#EEF2FF" fill-opacity="0.9" />
    
    <!-- Tassel String and Hanging Bead -->
    <path d="M38 19V30C38 31 36.5 32 35.5 32" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
    <circle cx="35.5" cy="32.5" r="2" fill="#FACC15" />

    <!-- Neural AI Nodes Pulsing from Bottom -->
    <circle cx="16" cy="39" r="2" fill="#38BDF8" />
    <circle cx="24" cy="41" r="2.5" fill="#FFFFFF" />
    <circle cx="32" cy="39" r="2" fill="#38BDF8" />
    <path d="M16 39L24 41L32 39" stroke="#E0E7FF" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Typography: PLACYRA -->
  <text x="66" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">
    PLACY<tspan fill="url(#placyraGlow)">RA</tspan>
  </text>

  <!-- Subtitle Tagline: CAMPUS AI -->
  <text x="67" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#94A3B8">
    CAMPUS AI ASSISTANT
  </text>
</svg>
